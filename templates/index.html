<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIZ TIME! — Redação</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ v }}">
</head>
<body>

<div id="app">

  <button id="mute-btn" title="Ativar/desativar som">🔊</button>
  <button id="fullscreen-btn" title="Tela cheia">⛶</button>

  <!-- INTRO -->
  <div class="screen active" id="screen-intro">
    <img id="time-logo" src="{{ url_for('static', filename='img/time_logo.jpg') }}?v={{ v }}" alt="TIME!">
    <div id="intro-title">QUIZ DA REDAÇÃO</div>
    <div id="intro-sub">Você tem o que é preciso para tirar nota 1000?</div>
    <button class="btn-start" id="btn-start">▶ COMEÇAR</button>
    <div class="small-note">toque para ativar o som</div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div id="quiz-stage">
      <div id="tv-frame">
        <div id="quiz-topbar">
          <span id="quiz-progress-label">PERGUNTA 1/{{ total }}</span>
          <span id="quiz-score-label">PONTOS: 0</span>
        </div>
        <div class="progress-dots" id="progress-dots"></div>
        <div id="question-box">
          <div id="question-text">Carregando...</div>
        </div>
        <div id="options"></div>
      </div>
      <img id="host-peek" src="{{ url_for('static', filename='img/host/host_1_idle.png') }}?v={{ v }}" alt="apresentador">
    </div>
  </div>

  <div id="feedback-banner"></div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div id="result-card">
      <img id="result-host" src="{{ url_for('static', filename='img/host/host_3_cheer.png') }}?v={{ v }}" alt="apresentador">
      <div id="result-title">FIM DE JOGO!</div>
      <div id="result-score">0/{{ total }}</div>
      <div id="result-msg"></div>
      <button class="btn-start" id="btn-retry">↻ JOGAR DE NOVO</button>
    </div>
  </div>

</div>

<audio id="audio-theme" src="{{ url_for('static', filename='audio/theme.mp3') }}?v={{ v }}" loop></audio>
<audio id="audio-tvtime" src="{{ url_for('static', filename='audio/tvtime.mp3') }}?v={{ v }}"></audio>

<script>
  const BG_QUESTION = "{{ url_for('static', filename='img/bg_question.jpg') }}?v={{ v }}";
  const BG_STAGE = "{{ url_for('static', filename='img/bg_stage.jpg') }}?v={{ v }}";
  const TOTAL_QUESTIONS = {{ total }};
  const HOST_FRAMES = [
    "{{ url_for('static', filename='img/host/host_1_idle.png') }}?v={{ v }}",
    "{{ url_for('static', filename='img/host/host_2_talk.png') }}?v={{ v }}",
    "{{ url_for('static', filename='img/host/host_3_cheer.png') }}?v={{ v }}",
    "{{ url_for('static', filename='img/host/host_4_laugh.png') }}?v={{ v }}"
  ];
</script>
<script src="{{ url_for('static', filename='js/quiz.js') }}?v={{ v }}"></script>

</body>
</html>
